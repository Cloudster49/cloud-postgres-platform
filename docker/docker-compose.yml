services:
  postgres:
    image: postgres:16
    container_name: cloud-postgres-db

    environment:
      POSTGRES_DB: cloud_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data:
